name: iOS Runtime Build Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-runtime-probe.yml"

permissions:
  contents: read

concurrency:
  group: ios-runtime-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-arm64-runtime:
    name: Compile PSX runtime for iOS ARM64
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out iOS prototype
        uses: actions/checkout@v4

      - name: Fetch shared PSX launcher UI
        run: |
          git clone --depth 1 https://github.com/RetroPortingToolKit/recomp-ui.git recomp-ui
          test -f recomp-ui/recomp_ui.cmake
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("recomp-ui/recomp_ui.cmake")
          s = p.read_text()
          pattern = r'(?m)^    if\(ANDROID\)\n        target_compile_definitions\(\$\{TGT\} PRIVATE\n            LNG_GLES2=1\n            IMGUI_IMPL_OPENGL_ES2=1\)\n    endif\(\)$'
          replacement = '''    if(ANDROID OR (APPLE AND CMAKE_SYSTEM_NAME STREQUAL "iOS"))
              target_compile_definitions(${TGT} PRIVATE
                  LNG_GLES2=1
                  IMGUI_IMPL_OPENGL_ES2=1)
          endif()'''
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not patch launcher GLES renderer selection")
          pattern = r'(?m)^    elseif\(WIN32\)\n        # ws2_32:'
          replacement = '''    elseif(APPLE AND CMAKE_SYSTEM_NAME STREQUAL "iOS")
                  find_library(RUI_OPENGLES_LIBRARY OpenGLES REQUIRED)
                  target_link_libraries(${TGT} PRIVATE
                      ${RUI_OPENGLES_LIBRARY} ${CMAKE_DL_LIBS})
              elseif(WIN32)
                  # ws2_32:'''
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not patch launcher iOS OpenGLES link branch")
          p.write_text(s)
          # The shared ImGui launcher calls raw GL functions directly. Its
          # desktop GL headers are not included by the SDL compatibility layer
          # on iOS, so explicitly include the OpenGLES 2 declarations.
          p = Path("recomp-ui/src/common/backends/imgui/launcher_imgui.cpp")
          s = p.read_text()
          marker = '#include "launcher_mod_integer.h"'
          include = """#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
          #include <OpenGLES/ES2/gl.h>
          #endif"""
          if include not in s:
              if marker not in s:
                  raise SystemExit("Could not locate launcher_imgui.cpp include marker")
              s = s.replace(marker, marker + chr(10) + include, 1)
              p.write_text(s)
          # The standalone launcher GL helper also uses raw GLES calls.
          p = Path("recomp-ui/src/common/launcher_gl.c")
          s = p.read_text()
          marker = '#include "launcher_gl.h"'
          include = """#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
          #include <OpenGLES/ES2/gl.h>
          #endif"""
          if include not in s:
              if marker not in s:
                  raise SystemExit("Could not locate launcher_gl.c include marker")
              s = s.replace(marker, marker + chr(10) + include, 1)
              p.write_text(s)
          # The launcher debug readback helper also uses GLES calls directly.
          p = Path("recomp-ui/src/common/launcher_debug.c")
          s = p.read_text()
          marker = '#include "launcher_debug.h"'
          include = """#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
          #include <OpenGLES/ES2/gl.h>
          #endif"""
          if include not in s:
              if marker not in s:
                  raise SystemExit("Could not locate launcher_debug.c include marker")
              s = s.replace(marker, marker + chr(10) + include, 1)
              p.write_text(s)
          # SDL's shared launcher currently requests desktop OpenGL 3.3.
          # iOS only provides OpenGL ES; request an ES 3.0 context there.
          p = Path("recomp-ui/src/common/launcher_platform_sdl3.c")
          s = p.read_text()
          pattern = r"(?m)^    SDL_GL_SetAttribute\(SDL_GL_CONTEXT_MAJOR_VERSION, 3\);\n    SDL_GL_SetAttribute\(SDL_GL_CONTEXT_MINOR_VERSION, 3\);\n    SDL_GL_SetAttribute\(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE\);$"
          replacement = "#if defined(__APPLE__)\n    /* Launcher ImGui is built with its GLES2 backend on iOS. Request the\n     * ES 2.0 baseline explicitly; ES 3.x profile requests have failed on\n     * some SDL/iOS combinations before the launcher can draw its first frame. */\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 2);\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 0);\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_ES);\n#else\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 3);\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 3);\n    SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE);\n#endif"
          s, n = re.subn(pattern, lambda _: replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not locate SDL3 launcher GL context attributes")
          p.write_text(s)

          # iOS presents SDL OpenGL content through a fullscreen UIKit-backed
          # drawable. A resizable desktop-style window can create a valid GLES
          # framebuffer while leaving the iOS presentation surface black.
          p = Path("recomp-ui/src/common/launcher_platform_sdl3.c")
          s = p.read_text()
          old = "    SDL_WindowFlags flags =" + chr(10) + "        SDL_WINDOW_OPENGL | SDL_WINDOW_RESIZABLE | SDL_WINDOW_HIGH_PIXEL_DENSITY;"
          new = "    SDL_WindowFlags flags =" + chr(10) + "#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)" + chr(10) + "        SDL_WINDOW_OPENGL | SDL_WINDOW_FULLSCREEN | SDL_WINDOW_HIGH_PIXEL_DENSITY;" + chr(10) + "#else" + chr(10) + "        SDL_WINDOW_OPENGL | SDL_WINDOW_RESIZABLE | SDL_WINDOW_HIGH_PIXEL_DENSITY;" + chr(10) + "#endif"
          if old not in s:
              raise SystemExit("Could not locate SDL3 launcher window flags")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # iOS defaults OpenGL ES drawable color storage to RGB565. Request
          # RGBA8 explicitly so the ImGui alpha-blended launcher uses a full
          # 8-bit-per-channel drawable on Retina devices.
          p = Path("recomp-ui/src/common/launcher_platform_sdl3.c")
          s = p.read_text()
          old = "    SDL_GL_SetAttribute(SDL_GL_DEPTH_SIZE, 0);"
          new = old + chr(10) + "#if defined(__APPLE__)" + chr(10) + "    SDL_GL_SetAttribute(SDL_GL_RED_SIZE, 8);" + chr(10) + "    SDL_GL_SetAttribute(SDL_GL_GREEN_SIZE, 8);" + chr(10) + "    SDL_GL_SetAttribute(SDL_GL_BLUE_SIZE, 8);" + chr(10) + "    SDL_GL_SetAttribute(SDL_GL_ALPHA_SIZE, 8);" + chr(10) + "#endif"
          if s.count(old) != 1:
              raise SystemExit("Could not locate SDL3 iOS GL color-buffer attributes")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Add StikDebug checkpoints through window creation and first frame.
          p = Path("recomp-ui/src/common/launcher_platform_sdl3.c")
          s = p.read_text()
          old = "    SDL_GL_MakeCurrent(p->window, p->gl);" + chr(10) + "    SDL_GL_SetSwapInterval(1);   // vsync — a launcher has no reason to spin"
          new_lines = [
              "    fprintf(stderr, \"[psxdiag] window_created\"); fflush(stderr);",
              "    if (!SDL_GL_MakeCurrent(p->window, p->gl)) { fprintf(stderr, \"[psxdiag] make_current_failed\"); fflush(stderr); return false; }",
              "    fprintf(stderr, \"[psxdiag] gl_context_current\"); fflush(stderr);",
              "    if (!SDL_GL_SetSwapInterval(1)) fprintf(stderr, \"[psxdiag] swap_interval_unavailable\");",
              "    fprintf(stderr, \"[psxdiag] window_gl_ready\"); fflush(stderr);"
          ]
          if old not in s: raise SystemExit("Could not locate SDL3 GL make-current block")
          s = s.replace(old, chr(10).join(new_lines), 1)
          anchors = [
              ("    launcher_boot_timing_mark(\"rui:platform_open:begin\");", "    fprintf(stderr, \"[psxdiag] platform_open_begin\"); fflush(stderr);"),
              ("    launcher_boot_timing_mark(\"rui:platform_open:window+gl_ready\");", "    fprintf(stderr, \"[psxdiag] platform_open_complete\"); fflush(stderr);")
          ]
          for old, line in anchors:
              if old not in s: raise SystemExit("Missing platform diagnostic anchor: " + old)
              s = s.replace(old, old + chr(10) + line, 1)
          p.write_text(s)
          p = Path("recomp-ui/src/common/backends/imgui/launcher_imgui.cpp")
          s = p.read_text()
          edits = [
              ("    launcher_boot_timing_mark(\"rui:backend_run:begin\");", "    std::fprintf(stderr, \"[psxdiag] backend_run_begin\"); std::fflush(stderr);"),
              ("    ImGui::CreateContext();", "    std::fprintf(stderr, \"[psxdiag] before_imgui_context_create\"); std::fflush(stderr);\n    ImGui::CreateContext();\n    std::fprintf(stderr, \"[psxdiag] imgui_context_created\"); std::fflush(stderr);"),
              ("    g_th = th;", "    std::fprintf(stderr, \"[psxdiag] before_theme_bind\"); std::fflush(stderr);\n    g_th = th;\n    std::fprintf(stderr, \"[psxdiag] after_theme_bind\"); std::fflush(stderr);"),
              ("    LNG_ImplSDL_InitForOpenGL(p->window, p->gl);", "    std::fprintf(stderr, \"[psxdiag] before_sdl_backend\"); std::fflush(stderr);\n    const bool sdl_backend_ok = LNG_ImplSDL_InitForOpenGL(p->window, p->gl);\n    std::fprintf(stderr, \"[psxdiag] imgui_sdl_backend=%d\", sdl_backend_ok ? 1 : 0); std::fflush(stderr);"),
              ("    ImGui_ImplOpenGL3_Init(\"#version 100\");   // GLES 2 GLSL (host ANGLE backend)", "    std::fprintf(stderr, \"[psxdiag] before_gl_backend\"); std::fflush(stderr);\n    const bool gl_backend_ok = ImGui_ImplOpenGL3_Init(\"#version 100\");   // GLES 2 GLSL (host ANGLE backend)\n    std::fprintf(stderr, \"[psxdiag] imgui_gl_backend=%d\", gl_backend_ok ? 1 : 0); std::fflush(stderr);"),
              ("    launcher_boot_timing_mark(\"rui:imgui_gl_ready\");", "    std::fprintf(stderr, \"[psxdiag] imgui_backends_ready\"); std::fflush(stderr);"),
              ("    launcher_boot_timing_mark(\"rui:textures_loaded\");", "    std::fprintf(stderr, \"[psxdiag] textures_loaded\"); std::fflush(stderr);"),
              ("    while ((m->action == LNG_ACTION_NONE && !p->should_quit) ||", "    std::fprintf(stderr, \"[psxdiag] entering_render_loop\"); std::fflush(stderr);\n    while ((m->action == LNG_ACTION_NONE && !p->should_quit) ||"),
              ("        ImGui::Render();", "        ImGui::Render();\n        if (!first_present_marked) { std::fprintf(stderr, \"[psxdiag] first_imgui_frame_built\"); std::fflush(stderr); }"),
              ("        glViewport(0, 0, p->pixel_w, p->pixel_h);", "        if (!first_present_marked) {\n            int ww=0, wh=0, dw=0, dh=0;\n            SDL_GetWindowSize(p->window, &ww, &wh);\n            SDL_GetWindowSizeInPixels(p->window, &dw, &dh);\n            ImDrawData* dd = ImGui::GetDrawData();\n            std::fprintf(stderr, \"[psxdiag] metrics window=%dx%d drawable=%dx%d platform=%dx%d logical=%dx%d\\n\", ww, wh, dw, dh, p->pixel_w, p->pixel_h, p->logical_w, p->logical_h);\n            std::fprintf(stderr, \"[psxdiag] draw display=%.1fx%.1f scale=%.2fx%.2f lists=%d vertices=%d indices=%d\\n\", dd->DisplaySize.x, dd->DisplaySize.y, dd->FramebufferScale.x, dd->FramebufferScale.y, dd->CmdListsCount, dd->TotalVtxCount, dd->TotalIdxCount);\n            std::fprintf(stderr, \"[psxdiag] GL version=%s renderer=%s error=0x%x\\n\", (const char*)glGetString(GL_VERSION), (const char*)glGetString(GL_RENDERER), (unsigned)glGetError());\n            std::fflush(stderr);\n        }\n        glViewport(0, 0, p->pixel_w, p->pixel_h);"),
              ("        ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());", "        ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());\n        if (!first_present_marked) {\n            GLint vp[4]={0,0,0,0}, fb=0; GLubyte center[4]={0,0,0,0}, corner[4]={0,0,0,0};\n            glGetIntegerv(GL_VIEWPORT, vp);\n            glGetIntegerv(GL_FRAMEBUFFER_BINDING, &fb);\n            const int sx = p->pixel_w > 0 ? p->pixel_w/2 : 0;\n            const int sy = p->pixel_h > 0 ? p->pixel_h/2 : 0;\n            glReadPixels(sx, sy, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, center);\n            glReadPixels(2, 2, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, corner);\n            unsigned bright_samples=0; unsigned max_rgb=0;\n            for (int gy=0; gy<32; ++gy) for (int gx=0; gx<32; ++gx) {\n                GLubyte px[4]={0,0,0,0};\n                int x=(gx*(p->pixel_w-1))/31, y=(gy*(p->pixel_h-1))/31;\n                glReadPixels(x,y,1,1,GL_RGBA,GL_UNSIGNED_BYTE,px);\n                unsigned m=px[0]; if(px[1]>m)m=px[1]; if(px[2]>m)m=px[2];\n                if(m>60) ++bright_samples;\n                if(m>max_rgb) max_rgb=m;\n            }\n            const GLenum draw_error = glGetError();\n            std::fprintf(stderr, \"[psxdiag] postdraw viewport=%d,%d,%d,%d framebuffer=%d center=%u,%u,%u,%u corner=%u,%u,%u,%u grid_bright=%u/1024 grid_max=%u error=0x%x\\n\", vp[0],vp[1],vp[2],vp[3],fb,center[0],center[1],center[2],center[3],corner[0],corner[1],corner[2],corner[3],bright_samples,max_rgb,(unsigned)draw_error);\n            std::fflush(stderr);\n        }"),
              ("        launcher_platform_present(p);", "        if (!first_present_marked) {\n            GLint bound_rb=0; glGetIntegerv(GL_RENDERBUFFER_BINDING, &bound_rb);\n            SDL_PropertiesID props=SDL_GetWindowProperties(p->window);\n            Sint64 drawable_fb=SDL_GetNumberProperty(props, SDL_PROP_WINDOW_UIKIT_OPENGL_FRAMEBUFFER_NUMBER, -1);\n            Sint64 drawable_rb=SDL_GetNumberProperty(props, SDL_PROP_WINDOW_UIKIT_OPENGL_RENDERBUFFER_NUMBER, -1);\n            GLenum fb_status=glCheckFramebufferStatus(GL_FRAMEBUFFER);\n            std::fprintf(stderr, \"[psxdiag] drawable framebuffer=%lld renderbuffer=%lld bound_renderbuffer=%d status=0x%x\\\\n\", (long long)drawable_fb, (long long)drawable_rb, bound_rb, (unsigned)fb_status); std::fflush(stderr);\n        }\n        if (!first_present_marked) {\n            /* One-build isolation test: paint the actual UIKit drawable immediately before presentation. */\n            glBindFramebuffer(GL_FRAMEBUFFER, (GLuint)SDL_GetNumberProperty(SDL_GetWindowProperties(p->window), SDL_PROP_WINDOW_UIKIT_OPENGL_FRAMEBUFFER_NUMBER, 0));\n            glViewport(0, 0, p->pixel_w, p->pixel_h);\n            glClearColor(1.0f, 0.0f, 1.0f, 1.0f);\n            glClear(GL_COLOR_BUFFER_BIT);\n            std::fprintf(stderr, \"[psxdiag] forced_magenta_drawable error=0x%x\\\\n\", (unsigned)glGetError());\n            std::fflush(stderr);\n        }\n        launcher_platform_present(p);\n        if (!first_present_marked) { std::fprintf(stderr, \"[psxdiag] first_frame_presented gl_error=0x%x\\\\n\", (unsigned)glGetError()); std::fflush(stderr); }"),
          ]
          for old, new in edits:
              if old not in s: raise SystemExit("Could not locate launcher diagnostic anchor: " + old[:90])
              s = s.replace(old, new, 1)
          p.write_text(s)
          # Report the actual font texture and the model state used to build the first frame.
          p = Path("recomp-ui/src/common/backends/imgui/launcher_imgui.cpp")
          s = p.read_text()
          old = "    ImGui_ImplOpenGL3_DestroyFontsTexture();\n    ImGui_ImplOpenGL3_CreateFontsTexture();"
          new = """    ImGui_ImplOpenGL3_DestroyFontsTexture();
              const bool psx_font_texture_ok = ImGui_ImplOpenGL3_CreateFontsTexture();
              std::fprintf(stderr, "[psxdiag] font_atlas loaded=%d size=%dx%d fonts=%d texture_ok=%d texid=%p gl_error=0x%x\\n",
                           loaded ? 1 : 0, io.Fonts->TexWidth, io.Fonts->TexHeight,
                           io.Fonts->Fonts.Size, psx_font_texture_ok ? 1 : 0,
                           (void*)io.Fonts->TexID, (unsigned)glGetError());
              std::fflush(stderr);
              if (!psx_font_texture_ok) {
                  io.Fonts->Clear();
                  ImFontConfig fallback_cfg;
                  io.Fonts->AddFontDefault(&fallback_cfg);
                  io.Fonts->Build();
                  const bool fallback_ok = ImGui_ImplOpenGL3_CreateFontsTexture();
                  std::fprintf(stderr, "[psxdiag] font_atlas_fallback size=%dx%d texture_ok=%d texid=%p gl_error=0x%x\\n",
                               io.Fonts->TexWidth, io.Fonts->TexHeight,
                               fallback_ok ? 1 : 0, (void*)io.Fonts->TexID,
                               (unsigned)glGetError());
                  std::fflush(stderr);
              }"""
          if old not in s:
              raise SystemExit("Could not locate ImGui font texture creation block")
          s = s.replace(old, new, 1)
          old = "void draw_ui(LauncherModel* m, const LauncherTheme& th, int logical_w, int logical_h) {\n    ImGuiViewport* vp = ImGui::GetMainViewport();"
          new = """void draw_ui(LauncherModel* m, const LauncherTheme& th, int logical_w, int logical_h) {
              static bool psx_ui_state_logged = false;
              if (!psx_ui_state_logged) {
                  psx_ui_state_logged = true;
                  std::fprintf(stderr, "[psxdiag] ui_state view=%d game=%s platform=%s profile=%p logical=%dx%d font=%p atlas=%dx%d texid=%p\\n",
                               (int)m->view, m->game_name ? m->game_name : "(null)",
                               m->platform ? m->platform : "(null)", m->profile,
                               logical_w, logical_h, (void*)ImGui::GetFont(),
                               ImGui::GetIO().Fonts->TexWidth, ImGui::GetIO().Fonts->TexHeight,
                               (void*)ImGui::GetIO().Fonts->TexID);
                  std::fflush(stderr);
              }
              ImGuiViewport* vp = ImGui::GetMainViewport();"""
          if old not in s:
              raise SystemExit("Could not locate draw_ui entry")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Add an unmistakable foreground test panel and inspect ImGui draw commands.
          # This distinguishes a dark-but-rendering launcher from missing UI/text rendering.
          p = Path("recomp-ui/src/common/backends/imgui/launcher_imgui.cpp")
          s = p.read_text()
          old = "    draw_footer(m, th, footer_h);"
          new = """    draw_footer(m, th, footer_h);
              {
                  ImDrawList* psx_fg = ImGui::GetForegroundDrawList();
                  psx_fg->AddRectFilled(ImVec2(10, 10), ImVec2(310, 66),
                                         IM_COL32(220, 0, 180, 255), 8.0f);
                  psx_fg->AddText(ImGui::GetFont(), 22.0f, ImVec2(20, 25),
                                  IM_COL32(255, 255, 255, 255),
                                  "PSXRECOMP RENDER TEST");
              }"""
          if old not in s:
              raise SystemExit("Could not locate launcher footer for render test overlay")
          s = s.replace(old, new, 1)
          old = "        ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());"
          new = """        if (!first_present_marked) {
              ImDrawData* psx_dd = ImGui::GetDrawData();
              int psx_cmds = 0;
              for (int li = 0; li < psx_dd->CmdListsCount; ++li) {
                  const ImDrawList* dl = psx_dd->CmdLists[li];
                  for (int ci = 0; ci < dl->CmdBuffer.Size; ++ci) {
                      const ImDrawCmd& cmd = dl->CmdBuffer[ci];
                      if (cmd.UserCallback) continue;
                      if (psx_cmds < 16) {
                          std::fprintf(stderr,
                              "[psxdiag] draw_cmd list=%d cmd=%d elems=%u tex=%p clip=%.1f,%.1f,%.1f,%.1f\\n",
                              li, ci, cmd.ElemCount, (void*)cmd.TextureId,
                              cmd.ClipRect.x, cmd.ClipRect.y,
                              cmd.ClipRect.z, cmd.ClipRect.w);
                      }
                      ++psx_cmds;
                  }
              }
              std::fprintf(stderr, "[psxdiag] draw_commands lists=%d commands=%d vertices=%d indices=%d\\n",
                           psx_dd->CmdListsCount, psx_cmds,
                           psx_dd->TotalVtxCount, psx_dd->TotalIdxCount);
              std::fflush(stderr);
          }
          ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());"""
          if old not in s:
              raise SystemExit("Could not locate ImGui draw submission for command diagnostics")
          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Patched iOS launcher with startup/render diagnostics")

          PY

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install cmake ninja

      # Build the host BIOS emitter before configuring the iOS target.
      - name: Configure host BIOS emitter
        run: |
          cmake -S recompiler -B recompiler/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSXRECOMP_ENABLE_CHD=OFF \
            -DBUILD_TESTING=OFF

      - name: Build host BIOS emitter
        run: |
          cmake --build recompiler/build-host --target psxrecomp-bios --parallel 3

      - name: Generate redistributable OpenBIOS backend
        run: |
          PSXRECOMP_BIOS_BUILD=recompiler/build-host tools/regen_bios.sh --config bios/OpenBIOS.toml

      - name: Configure iOS ARM64 runtime
        run: |
          set -o pipefail
          cmake -S runtime -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER=com.jesseb342.psxrecomp \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSX_SDL3_FETCH=ON \
            -DPSX_ENABLE_VULKAN=OFF \
            -DPSX_RECOMP_UI=ON \
            -DRECOMP_UI_ROOT="$GITHUB_WORKSPACE/recomp-ui" \
            -DRECOMP_UI_ENABLE_MODS=OFF \
            -DPSX_NETPLAY=OFF \
            -DPSX_REWIND=OFF \
            -DBUILD_TESTING=OFF \
            2>&1 | tee ios-configure.log

      - name: Instrument UIKit OpenGL presentation
        run: |
          set -euo pipefail
          SDL_VIEW="$(find build-ios -type f -path '*/src/video/uikit/SDL_uikitopenglview.m' -print -quit)"
          if [ -z "$SDL_VIEW" ]; then
            echo "::error::Could not locate SDL UIKit OpenGL view source after CMake configure"
            find build-ios -iname '*uikit*opengl*' -print || true
            exit 1
          fi
          python3 - "$SDL_VIEW" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '[context presentRenderbuffer:GL_RENDERBUFFER];'
          new = '''GLint psx_fbo = 0, psx_rb = 0;
              GLubyte psx_pixel[4] = {0, 0, 0, 0};
              glGetIntegerv(GL_FRAMEBUFFER_BINDING, &psx_fbo);
              glGetIntegerv(GL_RENDERBUFFER_BINDING, &psx_rb);
              glReadPixels(self.backingWidth / 2, self.backingHeight / 2, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, psx_pixel);
              fprintf(stderr, "[psxdiag] before_present current=%d fbo=%d drawable_fbo=%u rb=%d drawable_rb=%u size=%dx%d center=%u,%u,%u,%u gl_error=0x%x\\n",
                  [EAGLContext currentContext] == context ? 1 : 0, psx_fbo, self.drawableFramebuffer,
                  psx_rb, self.drawableRenderbuffer, self.backingWidth, self.backingHeight,
                  psx_pixel[0], psx_pixel[1], psx_pixel[2], psx_pixel[3], (unsigned)glGetError());
              BOOL psx_present_ok = [context presentRenderbuffer:GL_RENDERBUFFER];
              UIScreen *psx_screen = self.window.screen ?: [UIScreen mainScreen];
              fprintf(stderr, "[psxdiag] uikit_present result=%d view_window=%d hidden=%d alpha=%.2f frame=%.1fx%.1f bounds=%.1fx%.1f screen=%.1fx%.1f native=%.1fx%.1f scale=%.3f native_scale=%.3f content_scale=%.3f app_state=%ld\\n",
                  psx_present_ok ? 1 : 0, self.window != nil, self.hidden ? 1 : 0, self.alpha,
                  self.frame.size.width, self.frame.size.height, self.bounds.size.width, self.bounds.size.height,
                  psx_screen.bounds.size.width, psx_screen.bounds.size.height,
                  psx_screen.nativeBounds.size.width, psx_screen.nativeBounds.size.height,
                  psx_screen.scale, psx_screen.nativeScale, self.contentScaleFactor,
                  (long)[UIApplication sharedApplication].applicationState);
              fflush(stderr);
              static BOOL psx_hierarchy_logged = NO;
              if (!psx_hierarchy_logged) {
                  psx_hierarchy_logged = YES;
                  UIWindow *psx_window = self.window;
                  UIWindowScene *psx_scene = psx_window.windowScene;
                  fprintf(stderr, "[psxdiag] own_window key=%d hidden=%d alpha=%.2f level=%.1f frame=%.1fx%.1f root=%s scene_state=%ld screen_match=%d\\n",
                      psx_window.isKeyWindow ? 1 : 0, psx_window.hidden ? 1 : 0,
                      psx_window.alpha, psx_window.windowLevel,
                      psx_window.frame.size.width, psx_window.frame.size.height,
                      psx_window.rootViewController ? NSStringFromClass([psx_window.rootViewController class]).UTF8String : "(null)",
                      psx_scene ? (long)psx_scene.activationState : -1L,
                      psx_window.screen == psx_screen ? 1 : 0);
                  NSArray<UIWindow *> *psx_windows = [UIApplication sharedApplication].windows;
                  fprintf(stderr, "[psxdiag] app_windows count=%lu\\n", (unsigned long)psx_windows.count);
                  for (NSUInteger wi = 0; wi < psx_windows.count; ++wi) {
                      UIWindow *w = psx_windows[wi];
                      UIWindowScene *ws = w.windowScene;
                      fprintf(stderr, "[psxdiag] app_window index=%lu class=%s key=%d hidden=%d alpha=%.2f level=%.1f frame=%.1fx%.1f root=%s scene_state=%ld screen_match=%d\\n",
                          (unsigned long)wi, NSStringFromClass([w class]).UTF8String, w.isKeyWindow ? 1 : 0,
                          w.hidden ? 1 : 0, w.alpha, w.windowLevel,
                          w.frame.size.width, w.frame.size.height,
                          w.rootViewController ? NSStringFromClass([w.rootViewController class]).UTF8String : "(null)",
                          ws ? (long)ws.activationState : -1L,
                          w.screen == psx_screen ? 1 : 0);
                  }
                  UIView *psx_parent = self;
                  for (int depth = 0; psx_parent && depth < 6; ++depth) {
                      fprintf(stderr, "[psxdiag] view_chain depth=%d class=%s hidden=%d alpha=%.2f frame=%.1fx%.1f bounds=%.1fx%.1f z=%.2f subviews=%lu\\n",
                          depth, NSStringFromClass([psx_parent class]).UTF8String, psx_parent.hidden ? 1 : 0,
                          psx_parent.alpha, psx_parent.frame.size.width, psx_parent.frame.size.height,
                          psx_parent.bounds.size.width, psx_parent.bounds.size.height,
                          psx_parent.layer.zPosition, (unsigned long)psx_parent.subviews.count);
                      if (depth == 0 && psx_parent.superview) {
                          for (NSUInteger vi = 0; vi < psx_parent.superview.subviews.count; ++vi) {
                              UIView *sibling = psx_parent.superview.subviews[vi];
                              fprintf(stderr, "[psxdiag] sibling index=%lu class=%s hidden=%d alpha=%.2f frame=%.1fx%.1f z=%.2f\\n",
                                  (unsigned long)vi, NSStringFromClass([sibling class]).UTF8String,
                                  sibling.hidden ? 1 : 0, sibling.alpha,
                                  sibling.frame.size.width, sibling.frame.size.height,
                                  sibling.layer.zPosition);
                          }
                      }
                      psx_parent = psx_parent.superview;
                  }
                  fflush(stderr);
              }'''
          if s.count(old) != 1:
              raise SystemExit(f"Expected one UIKit present call, found {s.count(old)}")
          s = s.replace(old, new, 1)
          if '#include <stdio.h>' not in s:
              s = s.replace('#include "SDL_internal.h"', '#include "SDL_internal.h"' + chr(10) + '#include <stdio.h>', 1)
          p.write_text(s)
          print(f"Instrumented UIKit presentRenderbuffer in {p}")
          PY

      - name: Add native UIKit overlay probe
        run: |
          set -euo pipefail
          SDL_GL_CREATE="$(find build-ios -type f -path '*/src/video/uikit/SDL_uikitopengles.m' -print -quit)"
          if [ -z "$SDL_GL_CREATE" ]; then
            echo "::error::Could not locate SDL UIKit OpenGL context source"
            find build-ios -iname '*uikit*opengl*' -print || true
            exit 1
          fi
          python3 - "$SDL_GL_CREATE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          anchor = """        if (!UIKit_GL_MakeCurrent(_this, window, (__bridge SDL_GLContext)context)) {
                      UIKit_GL_DestroyContext(_this, (SDL_GLContext)CFBridgingRetain(context));
                      return NULL;
                  }
          """
          overlay = anchor + """        /* Native UIKit isolation probe: this view is independent of the
           * EAGL drawable and is placed above SDL's GL view in its UIKit parent. */
          UIView *psx_host = view.superview ? view.superview : view;
          UIView *psx_probe = [[UIView alloc] initWithFrame:CGRectMake(12.0, 48.0, 296.0, 76.0)];
          psx_probe.backgroundColor = [UIColor magentaColor];
          psx_probe.opaque = YES;
          psx_probe.alpha = 1.0;
          psx_probe.userInteractionEnabled = NO;
          psx_probe.layer.zPosition = 10000.0;
          UILabel *psx_label = [[UILabel alloc] initWithFrame:psx_probe.bounds];
          psx_label.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
          psx_label.text = @\"NATIVE UIKit VIEW TEST\";
          psx_label.textColor = [UIColor whiteColor];
          psx_label.font = [UIFont boldSystemFontOfSize:17.0];
          psx_label.textAlignment = NSTextAlignmentCenter;
          [psx_probe addSubview:psx_label];
          [psx_host addSubview:psx_probe];
          [psx_host bringSubviewToFront:psx_probe];
          fprintf(stderr, \"[psxdiag] native_uikit_overlay_added parent=%s window=%d subviews=%lu\\n\",
                  NSStringFromClass([psx_host class]).UTF8String, psx_probe.window != nil,
                  (unsigned long)psx_host.subviews.count);
          fflush(stderr);
          """
          if s.count(anchor) != 1:
              raise SystemExit(f"Expected one UIKit context attachment block, found {s.count(anchor)}")
          p.write_text(s.replace(anchor, overlay, 1))
          print(f"Added native UIKit overlay probe to {p}")
          PY

      - name: Compile iOS runtime
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target psx-runtime --parallel 3 \
            2>&1 | tee ios-build.log

      - name: Package unsigned iOS IPA
        run: |
          set -euo pipefail
          APP_PATH="build-ios/Release-iphoneos/PSXRecomp.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -n "$EXECUTABLE"
          test -f "$APP_PATH/$EXECUTABLE"
          # The runtime resolves OpenBIOS relative to the executable. Bundle the
          # redistributable image and its required MIT notice inside the app.
          test -s bios/openbios.bin
          test -s bios/OpenBIOS.LICENSE
          mkdir -p "$APP_PATH/bios"
          install -m 0644 bios/openbios.bin "$APP_PATH/bios/openbios.bin"
          install -m 0644 bios/OpenBIOS.LICENSE "$APP_PATH/bios/OpenBIOS.LICENSE"
          test -s "$APP_PATH/bios/openbios.bin"
          # recomp-ui stages its fonts and console images beside the executable.
          # Make sure that staged directory is actually inside the iOS app bundle:
          # the app is relocated into its Documents container by some sideloaders,
          # so relying on the build tree or runner working directory is unsafe.
          FONT_ASSET=$(find build-ios -type f -path '*/assets/fonts/LatoLatin-Regular.ttf' -print -quit)
          if [ -z "$FONT_ASSET" ]; then
            echo "::error::recomp-ui font asset was not staged by CMake"
            find build-ios/Release-iphoneos -type d -name assets -print || true
            exit 1
          fi
          ASSET_ROOT="${FONT_ASSET%/fonts/LatoLatin-Regular.ttf}"
          if [ "$ASSET_ROOT" != "$APP_PATH/assets" ]; then
            rm -rf "$APP_PATH/assets"
            ditto "$ASSET_ROOT" "$APP_PATH/assets"
          fi
          test -s "$APP_PATH/assets/fonts/LatoLatin-Regular.ttf"
          test -s "$APP_PATH/assets/fonts/LatoLatin-Bold.ttf"
          test -s "$APP_PATH/assets/img/flags.png"
          test -s "$APP_PATH/assets/img/pad_analog.tga"
          echo "Verified launcher assets in app bundle:"
          find "$APP_PATH/assets" -type f -maxdepth 3 -print | sort
          # Add the iOS indirect-input capability requested by SDL3.
          if ! /usr/libexec/PlistBuddy -c 'Print :UIApplicationSupportsIndirectInputEvents' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :UIApplicationSupportsIndirectInputEvents bool true' "$APP_PATH/Info.plist"
          fi
          # iOS/SDL require a valid launch-screen configuration to avoid legacy
          # compatibility sizing. Replace the key unconditionally: merely checking
          # that it exists can preserve a malformed non-dictionary value.
          /usr/libexec/PlistBuddy -c 'Delete :UILaunchScreen' "$APP_PATH/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen dict' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP_PATH/Info.plist" | grep -q 'Dict'
          # CMake's Xcode generator did not emit CFBundleIdentifier in this target's plist.
          # Add the stable app identifier before packaging if it is absent.
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.jesseb342.psxrecomp' "$APP_PATH/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          # Expose Documents in Files so iOS startup diagnostics can be retrieved.
          if ! /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$APP_PATH/Info.plist"
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$APP_PATH/Info.plist"
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry PSXRecomp-unsigned.ipa Payload
          test -s PSXRecomp-unsigned.ipa
          # Verify the archived app plist, not only the pre-archive build tree.
          mkdir -p ipa-verify
          /usr/bin/unzip -q PSXRecomp-unsigned.ipa 'Payload/PSXRecomp.app/Info.plist' -d ipa-verify
          plutil -lint ipa-verify/Payload/PSXRecomp.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' ipa-verify/Payload/PSXRecomp.app/Info.plist | grep -q 'Dict'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ipa-verify/Payload/PSXRecomp.app/Info.plist
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/Info.plist'
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/bios/openbios.bin'
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/bios/OpenBIOS.LICENSE'
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/assets/fonts/LatoLatin-Regular.ttf'
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/assets/img/flags.png'
          /usr/bin/unzip -l PSXRecomp-unsigned.ipa | grep -F 'Payload/PSXRecomp.app/assets/img/pad_analog.tga'
          ls -lh PSXRecomp-unsigned.ipa

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-unsigned-ipa
          path: PSXRecomp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-build-diagnostics
          path: |
            ios-configure.log
            ios-build.log
            build-ios/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 14
